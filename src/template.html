<title>Curitiba Day Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: full-bleed night canvas, reel-style readout card top-left, control dock bottom. One committed dark look. */
:root {
  --bg: #0a0c11;
  --panel: rgba(14, 17, 25, 0.80);
  --line: rgba(255, 255, 255, 0.10);
  --fg: #f1f3f8;
  --muted: #8b92a6;
  --heat: #ff7620;
  --hot: #ffc857;
  --bus: #ff8a1f;
  --brt: #ff4d4d;
  --lig: #b8bcc8;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 500 14px/1.35 var(--f-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); touch-action: none; }
.reset {
  position: absolute;
  right: 0;
  min-height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  font: 600 12px/1 var(--f-body);
  background: var(--panel);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.ui {
  position: relative;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
}
.ui > * { pointer-events: auto; }
.top-stack { align-self: flex-start; max-width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
.top-stack > .hud { pointer-events: auto; }
.sel {
  pointer-events: none;
  max-width: min(260px, 100%);
  min-width: 110px;
  padding: 6px 9px;
  font: 600 12px/1.25 var(--f-body);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.sel b { color: var(--fg); font: 700 15px/1.1 var(--f-display); }
.sel b.m0 { color: var(--bus); }
.sel b.m1 { color: var(--brt); }
.sel b.m2 { color: var(--lig); }
@media (min-width: 900px) and (hover: hover) and (pointer: fine) {
  .top-stack { zoom: 2; }
}
.sel .selcount { margin-top: 3px; font: 600 12px/1.2 var(--f-body); font-variant-numeric: tabular-nums; }
.sel .selcount b { font-size: 15px; }
.sel small { display: block; margin-top: 2px; font: 600 9px/1.2 var(--f-body); letter-spacing: 0.04em; color: var(--muted); }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.hud { width: min(196px, 100%); padding: 5px 7px 6px; border-radius: 10px; display: grid; gap: 4px; }
.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.clock {
  margin: 0;
  flex: none;
  font: 700 27px/1 var(--f-display);
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}
#spark { display: block; flex: 1 1 0; min-width: 0; height: 24px; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.chip {
  display: grid;
  gap: 1px;
  padding: 3px 5px 3px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  text-align: left;
  min-width: 0;
  transition: opacity 0.15s;
}
.chip .num { display: flex; align-items: center; gap: 4px; font: 700 12px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.chip .lab { font: 600 8px/1 var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chip.c-bus .num { color: var(--bus); }
.chip.c-lig .num { color: var(--lig); }
.chip.c-brt .num { color: var(--brt); }
.chip[aria-pressed="false"] { opacity: 0.38; }
.chip[aria-pressed="false"] .num { text-decoration: line-through; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.bus { background: var(--bus); box-shadow: 0 0 6px var(--bus); }
.dot.brt { background: var(--brt); box-shadow: 0 0 6px var(--brt); }
.dot.lig { background: var(--lig); box-shadow: 0 0 6px var(--lig); }
.dock { padding: 5px 6px; display: flex; flex-direction: column; gap: 4px; border-radius: 10px; }
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}
.transport { display: flex; align-items: center; gap: 8px; min-width: 0; }
#play {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--fg);
  color: var(--bg);
  display: grid;
  place-items: center;
}
#play svg { width: 14px; height: 14px; display: block; }
#scrub { flex: 1; min-width: 0; height: 34px; accent-color: var(--heat); margin: 0; }
#speed, #day {
  flex: none;
  min-width: 52px;
  min-height: 30px;
  padding: 0 7px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.08);
  font: 600 12px/1 var(--f-body);
}
#info {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  font: 600 13px/1 var(--f-display);
  color: var(--muted);
}
#info[aria-expanded="true"] { color: var(--fg); background: rgba(255, 255, 255, 0.16); }
.note { margin: 2px 2px 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
</style>

<canvas id="map" aria-label="Map of Curitiba showing buses and BRT vehicles moving along their routes through the day"></canvas>
<div class="ui">
  <button type="button" class="reset" id="zoomReset" hidden>Reset zoom</button>
  <div class="top-stack">
  <section class="hud panel" aria-label="Current time and vehicle counts">
    <div class="top">
      <p class="clock" id="clock">07:30</p>
      <canvas id="spark" aria-hidden="true"></canvas>
    </div>
    <div class="counts" role="group" aria-label="Show or hide vehicle groups">
      <button type="button" class="chip c-bus" data-g="bus" aria-pressed="true" aria-label="Buses on the road. Tap to hide or show."><span class="num"><i class="dot bus"></i><b id="nBus">0</b></span><span class="lab">Buses</span></button>
      <button type="button" class="chip c-lig" data-g="lig" aria-pressed="true" aria-label="Ligeirinho on the road. Tap to hide or show."><span class="num"><i class="dot lig"></i><b id="nLig">0</b></span><span class="lab">Ligeirinho</span></button>
      <button type="button" class="chip c-brt" data-g="brt" aria-pressed="true" aria-label="BRT on the road. Tap to hide or show."><span class="num"><i class="dot brt"></i><b id="nBrt">0</b></span><span class="lab">BRT</span></button>
    </div>
  </section>
  <p class="sel panel" id="sel" hidden></p>
  </div>
  <footer class="dock panel">
    <div class="transport">
      <button type="button" id="play" aria-label="Pause"></button>
      <input id="scrub" type="range" min="0" max="1440" step="1" value="210" aria-label="Time of day">
      <button type="button" id="day" aria-label="Timetable day: Weekday. Tap to change.">Weekday</button>
      <button type="button" id="speed" aria-label="Playback speed: Normal, 30 timetable minutes per second">Normal</button>
      <button type="button" id="info" aria-label="About this data" aria-expanded="false" aria-controls="note">i</button>
    </div>
    <p class="note" id="note" hidden>Built from the URBS Curitiba timetable (GTFS). Trip durations are estimated from route length, at 18 km/h for buses, 21 km/h for Ligeirinho and 24 km/h for BRT (Expresso and Ligeirão lines).</p>
  </footer>
</div>

    }
    return best;
  }

  var ptrs = new Map(), moved = false, sx = 0, sy = 0, pinch = null;

  function pinchStart() {
    var a = Array.from(ptrs.values());
    if (a.length < 2) { pinch = null; return; }
    var mxp = (a[0].x + a[1].x) / 2, myp = (a[0].y + a[1].y) / 2;
    pinch = {
      d0: Math.max(10, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y)), z0: view.z,
      cx: (mxp - view.x) / view.z, cy: (myp - view.y) / view.z
    };
  }

  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { moved = false; sx = e.clientX; sy = e.clientY; }
    else { moved = true; pinchStart(); }
  });
  cv.addEventListener('pointermove', function (e) {
    var p = ptrs.get(e.pointerId);
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
      if (moved && (dx || dy)) { view.x += dx; view.y += dy; viewChanged(); }
    } else if (ptrs.size === 2 && pinch) {
      var a = Array.from(ptrs.values());
      var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      var mxp = (a[0].x + a[1].x) / 2, myp = (a[0].y + a[1].y) / 2;
      var z = Math.min(14, Math.max(1, pinch.z0 * d / pinch.d0));
      view.z = z; view.x = mxp - pinch.cx * z; view.y = myp - pinch.cy * z;
      viewChanged();
    }
  });
  function ptrEnd(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size === 1) { moved = true; pinch = null; } else if (ptrs.size === 0) pinch = null;
    else pinchStart();
  }
  cv.addEventListener('pointerup', ptrEnd);
  cv.addEventListener('pointercancel', ptrEnd);
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var z = Math.min(14, Math.max(1, view.z * Math.exp(-e.deltaY * 0.0015)));
    var r = z / view.z;
    view.x = e.clientX - (e.clientX - view.x) * r; view.y = e.clientY - (e.clientY - view.y) * r; view.z = z;
    viewChanged();
  }, { passive: false });
  zoomResetBtn.addEventListener('click', function () { view.z = 1; view.x = 0; view.y = 0; viewChanged(); });

  cv.addEventListener('click', function (e) {
    if (moved) { moved = false; return; }
    if (sel !== null) { setSel(null); return; }
    var rect = cv.getBoundingClientRect();
    var pi = pick((e.clientX - rect.left) * dpr, (e.clientY - rect.top) * dpr);
    if (pi >= 0) setSel(paths[pi].r, paths[pi].nm, paths[pi].m);
  });

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    var kk = view.z / vs.z;
    if (kk === 1 && view.x === vs.x && view.y === vs.y) ctx.drawImage(st, 0, 0);
    else {
      ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.setTransform(kk, 0, 0, kk, (view.x - vs.x * kk) * dpr, (view.y - vs.y * kk) * dpr);
      ctx.drawImage(st, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    zk = Math.min(2, 1 + 0.15 * (view.z - 1));
    var T = D.trips[day], abs = 14400 + simT, nb = 0, nr = 0, nl = 0, sa = 0, i, len = T.p.length;
    for (i = 0; i < len; i++) {
      var s = T.s[i], e = T.e[i];
      if (abs < s || abs >= e) continue;
      var P = paths[T.p[i]], f = (abs - s) / (e - s);
      if (sel !== null && P.r === sel) sa++;
      if (P.m === 1) { if (nr < 3000) { place(P, f, brtXY, 2 * nr); brtPI[nr] = T.p[i]; nr++; } }
      else if (P.m === 2) { if (nl < 3000) { place(P, f, ligXY, 2 * nl); ligPI[nl] = T.p[i]; nl++; } }
      else if (nb < 8000) { place(P, f, busXY, 2 * nb); busPI[nb] = T.p[i]; nb++; }
    }
    if (sel !== null && selNum && sa !== lastSa) {
      lastSa = sa;
      selNum.textContent = sa;
      selTxt.nodeValue = sa === 1 ? ' bus running' : ' buses running';
    }
    var cb = nb, cl = nl, cr = nr;
    if (!vis.bus) nb = 0;
    if (!vis.lig) nl = 0;
    if (!vis.brt) nr = 0;
    lastNb = nb; lastNl = nl; lastNr = nr;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = sel !== null ? 0.2 : 1;
    var r = 0.75 * dpr * zk;
    ctx.fillStyle = 'rgba(255,138,31,0.18)';
    ctx.beginPath();
    for (i = 0; i < nb; i++) { ctx.moveTo(busXY[2 * i] + r * 2.6, busXY[2 * i + 1]); ctx.arc(busXY[2 * i], busXY[2 * i + 1], r * 2.6, 0, 6.2832); }
    ctx.fill();
    ctx.fillStyle = '#ff9a3a';
    ctx.beginPath();
    for (i = 0; i < nb; i++) { ctx.moveTo(busXY[2 * i] + r, busXY[2 * i + 1]); ctx.arc(busXY[2 * i], busXY[2 * i + 1], r, 0, 6.2832); }
    ctx.fill();
    var rl = 1.9 * dpr * zk;
    ctx.fillStyle = 'rgba(184,188,200,0.18)';
    ctx.beginPath();
    for (i = 0; i < nl; i++) { ctx.moveTo(ligXY[2 * i] + rl * 2.4, ligXY[2 * i + 1]); ctx.arc(ligXY[2 * i], ligXY[2 * i + 1], rl * 2.4, 0, 6.2832); }
    ctx.fill();
    ctx.fillStyle = '#d3d6e0';
    ctx.beginPath();
    for (i = 0; i < nl; i++) { ctx.moveTo(ligXY[2 * i] + rl, ligXY[2 * i + 1]); ctx.arc(ligXY[2 * i], ligXY[2 * i + 1], rl, 0, 6.2832); }
    ctx.fill();
    var rb = 2.6 * dpr * zk;
    ctx.fillStyle = 'rgba(255,77,77,0.26)';
    ctx.beginPath();
    for (i = 0; i < nr; i++) { ctx.moveTo(brtXY[2 * i] + rb * 2.4, brtXY[2 * i + 1]); ctx.arc(brtXY[2 * i], brtXY[2 * i + 1], rb * 2.4, 0, 6.2832); }
    ctx.fill();
    ctx.fillStyle = '#ff6464';
    ctx.beginPath();
    for (i = 0; i < nr; i++) { ctx.moveTo(brtXY[2 * i] + rb, brtXY[2 * i + 1]); ctx.arc(brtXY[2 * i], brtXY[2 * i + 1], rb, 0, 6.2832); }
    ctx.fill();
    ctx.globalAlpha = 1;
    if (sel !== null) {
      drawSel(busXY, busPI, nb, 'rgba(255,138,31,0.35)', '#ffb24d');
      drawSel(ligXY, ligPI, nl, 'rgba(184,188,200,0.35)', '#e6e8ef');
      drawSel(brtXY, brtPI, nr, 'rgba(255,77,77,0.40)', '#ff6b6b');
    }
    ctx.globalCompositeOperation = 'source-over';
    var m = Math.min(1440, Math.floor(simT / 60));
    if (m !== lastMin) {
      lastMin = m;
      var mod = (240 + m) % 1440;
      el.clock.textContent = pad2(Math.floor(mod / 60)) + ':' + pad2(mod % 60);
      drawSpark(m);
      if (!dragging) el.scrub.value = m;
    }
    el.nBus.textContent = cb.toLocaleString('en');
    el.nBrt.textContent = cr.toLocaleString('en');
    el.nLig.textContent = cl.toLocaleString('en');
  }

  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.1, (ts - last) / 1000); last = ts;
    if (playing) { simT += dt * SPEEDS[speedI].v * 60; if (simT >= 86400) simT -= 86400; dirty = true; }
    if (viewDirty) { applyView(); viewDirty = false; dirty = true; }
    if (dirty) { draw(); dirty = false; }
    requestAnimationFrame(frame);
  }

  function setPlay(v) {
    playing = v;
    el.play.setAttribute('aria-label', v ? 'Pause' : 'Play');
    el.play.innerHTML = v
      ? '<svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="4.2" height="14" rx="1"/><rect x="10.8" y="2" width="4.2" height="14" rx="1"/></svg>'
      : '<svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M4 2.2v13.6a.8.8 0 0 0 1.2.7l11-6.8a.8.8 0 0 0 0-1.4l-11-6.8A.8.8 0 0 0 4 2.2z"/></svg>';
  }

  el.play.addEventListener('click', function () { setPlay(!playing); });
  el.speed.addEventListener('click', function () {
    speedI = (speedI + 1) % SPEEDS.length;
    var sp = SPEEDS[speedI];
    el.speed.textContent = sp.n;
    el.speed.setAttribute('aria-label', 'Playback speed: ' + sp.n + ', ' + sp.v + ' timetable minutes per second');
  });
  var infoBtn = document.getElementById('info'), noteEl = document.getElementById('note');
  infoBtn.addEventListener('click', function () {
    var open = noteEl.hidden;
    noteEl.hidden = !open;
    infoBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    layout();
  });
  el.scrub.addEventListener('input', function () { dragging = true; simT = Math.min(1440, +el.scrub.value) * 60; dirty = true; });
  el.scrub.addEventListener('change', function () { dragging = false; });
  var dayBtn = document.getElementById('day'), DAY_ORDER = ['wk', 'sat', 'sun'];
  dayBtn.addEventListener('click', function () {
    day = DAY_ORDER[(DAY_ORDER.indexOf(day) + 1) % 3];
    sel = null; selEl.hidden = true;
    dayBtn.textContent = NAMES[day];
    dayBtn.setAttribute('aria-label', 'Timetable day: ' + NAMES[day] + '. Tap to change.');
    buildStatic(); buildSpark(); lastMin = -1; dirty = true;
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.addEventListener('click', function () {
      var g = c.getAttribute('data-g');
      vis[g] = !vis[g];
      c.setAttribute('aria-pressed', vis[g] ? 'true' : 'false');
      dirty = true;
    });
  });

  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 120); });
  setPlay(playing);
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { buildStatic(); dirty = true; });
  requestAnimationFrame(frame);
})();
</script>
