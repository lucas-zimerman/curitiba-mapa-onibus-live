<meta charset="utf-8">
<title>Curitiba Day Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: full-bleed night canvas, reel-style readout card top-left, control dock bottom. One committed dark look. */
:root {
  --bg: #0a0c11;
  --panel: rgba(14, 17, 25, 0.80);
  --line: rgba(255, 255, 255, 0.10);
  --fg: #f1f3f8;
  --muted: #8b92a6;
  --heat: #ff7620;
  --hot: #ffc857;
  --bus: #ff8a1f;
  --brt: #ff4d4d;
  --lig: #b8bcc8;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; box-sizing: border-box; overscroll-behavior: none; }
#err {
  position: fixed;
  left: 8px;
  right: 8px;
  top: 8px;
  z-index: 50;
  padding: 10px 12px;
  border-radius: 10px;
  background: #3a0d12;
  border: 1px solid #ff6b6b;
  color: #ffd7d7;
  font: 600 12px/1.35 system-ui, -apple-system, sans-serif;
  word-break: break-word;
}
body {
  background: var(--bg);
  color: var(--fg);
  font: 500 14px/1.35 var(--f-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); touch-action: none; }
.floaters { position: absolute; right: 0; display: flex; align-items: center; gap: 6px; }
.reset, .langbtn, .sndbtn {
  min-height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  font: 600 12px/1 var(--f-body);
  background: var(--panel);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.langbtn { display: inline-flex; align-items: center; gap: 2px; padding: 0 3px; }
.langbtn span { padding: 6px 8px; border-radius: 13px; color: var(--muted); letter-spacing: 0.04em; }
.sndbtn { display: inline-flex; align-items: center; justify-content: center; width: 34px; padding: 0; color: var(--fg); }
.sndbtn svg { width: 16px; height: 16px; }
.sndbtn[aria-pressed="false"] { color: var(--muted); }
.note a { color: var(--fg); }
.langbtn span.on { background: rgba(255, 255, 255, 0.16); color: var(--fg); }
.ui {
  position: relative;
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  pointer-events: none;
}
.ui > * { pointer-events: auto; }
.top-stack { align-self: flex-start; max-width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
.top-stack > .hud { pointer-events: auto; }
.sel {
  pointer-events: none;
  max-width: min(260px, 100%);
  min-width: 110px;
  padding: 6px 9px;
  font: 600 12px/1.25 var(--f-body);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.sel b { color: var(--fg); font: 700 15px/1.1 var(--f-display); }
.sel b.m0 { color: var(--bus); }
.sel b.m1 { color: var(--brt); }
.sel b.m2 { color: var(--lig); }
@media (min-width: 900px) and (hover: hover) and (pointer: fine) {
  .top-stack { zoom: 2; }
}
@media (max-width: 600px) and (orientation: portrait) and (pointer: coarse) {
  .top-stack { zoom: 1.5; }
}
.sel .selcount { margin-top: 3px; font: 600 12px/1.2 var(--f-body); font-variant-numeric: tabular-nums; }
.sel .selcount b { font-size: 15px; }
.sel small { display: block; margin-top: 2px; font: 600 9px/1.2 var(--f-body); letter-spacing: 0.04em; color: var(--muted); }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.hud { width: min(196px, 100%); padding: 5px 7px 6px; border-radius: 10px; display: grid; gap: 4px; }
.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.clock {
  margin: 0;
  flex: none;
  font: 700 27px/1 var(--f-display);
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}
#spark { display: block; flex: 1 1 0; min-width: 0; height: 24px; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.chip {
  display: grid;
  gap: 1px;
  padding: 3px 5px 3px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  text-align: left;
  min-width: 0;
  transition: opacity 0.15s;
}
.chip .num { display: flex; align-items: center; gap: 4px; font: 700 12px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.chip .lab { font: 600 8px/1 var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chip.c-bus .num { color: var(--bus); }
.chip.c-lig .num { color: var(--lig); }
.chip.c-brt .num { color: var(--brt); }
.chip[aria-pressed="false"] { opacity: 0.38; }
.chip[aria-pressed="false"] .num { text-decoration: line-through; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.bus { background: var(--bus); box-shadow: 0 0 6px var(--bus); }
.dot.brt { background: var(--brt); box-shadow: 0 0 6px var(--brt); }
.dot.lig { background: var(--lig); box-shadow: 0 0 6px var(--lig); }
.dock { padding: 5px 6px; display: flex; flex-direction: column; gap: 4px; border-radius: 10px; }
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}
.transport { display: flex; align-items: center; gap: 8px; min-width: 0; }
#play {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--fg);
  color: var(--bg);
  display: grid;
  place-items: center;
}
#play svg { width: 14px; height: 14px; display: block; }
#scrub { flex: 1; min-width: 0; height: 34px; accent-color: var(--heat); margin: 0; }
#speed, #day {
  flex: none;
  min-width: 52px;
  min-height: 30px;
  padding: 0 7px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.08);
  font: 600 12px/1 var(--f-body);
}
#info {
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  font: 600 13px/1 var(--f-display);
  color: var(--muted);
}
#info[aria-expanded="true"] { color: var(--fg); background: rgba(255, 255, 255, 0.16); }
.note { margin: 2px 2px 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
</style>

<canvas id="map" aria-label="Map of Curitiba showing buses and BRT vehicles moving along their routes through the day"></canvas>
<div class="ui">
  <div class="floaters" id="floaters">
    <button type="button" class="reset" id="zoomReset" hidden>Reset zoom</button>
    <button type="button" class="sndbtn" id="snd" aria-pressed="true" aria-label="Music on. Tap to mute."></button>
    <button type="button" class="langbtn" id="lang" aria-label="Language: English. Tap to switch to Portuguese."><span data-l="pt">PT</span><span data-l="en" class="on">EN</span></button>
  </div>
  <div class="top-stack">
  <section class="hud panel" aria-label="Current time and vehicle counts">
    <div class="top">
      <p class="clock" id="clock">07:30</p>
      <canvas id="spark" aria-hidden="true"></canvas>
    </div>
    <div class="counts" role="group" aria-label="Show or hide vehicle groups">
      <button type="button" class="chip c-bus" data-g="bus" aria-pressed="true" aria-label="Buses on the road. Tap to hide or show."><span class="num"><i class="dot bus"></i><b id="nBus">0</b></span><span class="lab">Buses</span></button>
      <button type="button" class="chip c-lig" data-g="lig" aria-pressed="true" aria-label="Ligeirinho on the road. Tap to hide or show."><span class="num"><i class="dot lig"></i><b id="nLig">0</b></span><span class="lab">Ligeirinho</span></button>
      <button type="button" class="chip c-brt" data-g="brt" aria-pressed="true" aria-label="BRT on the road. Tap to hide or show."><span class="num"><i class="dot brt"></i><b id="nBrt">0</b></span><span class="lab">BRT</span></button>
    </div>
  </section>
  <p class="sel panel" id="sel" hidden></p>
  </div>
  <footer class="dock panel">
    <div class="transport">
      <button type="button" id="play" aria-label="Pause"></button>
      <input id="scrub" type="range" min="0" max="1440" step="1" value="210" aria-label="Time of day">
      <button type="button" id="day" aria-label="Timetable day: Weekday. Tap to change.">Weekday</button>
      <button type="button" id="speed" aria-label="Playback speed: Normal, 30 timetable minutes per second">Normal</button>
      <button type="button" id="info" aria-label="About this data" aria-expanded="false" aria-controls="note">i</button>
    </div>
    <p class="note" id="note" hidden>Built from the URBS Curitiba timetable (GTFS). Trip durations are estimated from route length, at 18 km/h for buses, 21 km/h for Ligeirinho and 24 km/h for BRT (Expresso and Ligeirão lines).</p>
  </footer>
</div>

window.addEventListener('error', function (e) {
  try {
    var b = document.getElementById('err');

    b.textContent = 'Error: ' + (e.message || 'unknown') + (e.lineno ? ' (line ' + e.lineno + ')' : '') + '. Reload the page; if it persists, send this message.';
  } catch (x) { /* nothing more to do */ }
});
</script>

      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
    }
    if (!actx) return;
    if (want) {
      actx.resume();
      if (!sndLoad) {
        var probe = document.createElement('audio');
        var opus = !!(probe.canPlayType && probe.canPlayType('audio/webm; codecs="opus"'));
        sndLoad = (opus ? loadTrack('snd/snd.opus.bin').catch(function () { return loadTrack('snd/snd.mp3.bin'); })
                        : loadTrack('snd/snd.mp3.bin'))
          .then(function (buf) {
            var src = actx.createBufferSource();
            src.buffer = buf; src.loop = true;
            src.connect(actx.destination); src.start();
          })
          .catch(function (e) { sndLoad = null; if (window.console) console.warn('music failed to load', e); });
      }
    } else if (actx.state === 'running') actx.suspend();
  }
  sndBtn.addEventListener('click', function () { muted = !muted; syncSnd(); syncAudio(); });

  function setPlay(v) {
    playing = v; anchor = null;
    el.play.setAttribute('aria-label', v ? L.pause : L.play);
    el.play.innerHTML = v
      ? '<svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="4.2" height="14" rx="1"/><rect x="10.8" y="2" width="4.2" height="14" rx="1"/></svg>'
      : '<svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M4 2.2v13.6a.8.8 0 0 0 1.2.7l11-6.8a.8.8 0 0 0 0-1.4l-11-6.8A.8.8 0 0 0 4 2.2z"/></svg>';
  }

  el.play.addEventListener('click', function () { setPlay(!playing); syncAudio(); });
  var dayBtn = document.getElementById('day'), DAY_ORDER = ['wk', 'sat', 'sun'];
  var langBtn = document.getElementById('lang');

  function syncDay() {
    dayBtn.textContent = L[day];
    dayBtn.setAttribute('aria-label', L.dayAria.replace('{d}', L[day]));
  }
  function syncSpeed() {
    var k = SPEEDS[speedI].k;
    el.speed.textContent = L[k];
    el.speed.setAttribute('aria-label', k === 'live' ? L.spdLiveAria : L.spdAria.replace('{s}', L[k]));
  }
  function setDay(d) {
    if (d === day) return;
    day = d;
    sel = null; selEl.hidden = true;
    syncDay();
    buildStatic(); buildSpark(); lastMin = -1; dirty = true;
  }
  el.speed.addEventListener('click', function () {
    speedI = (speedI + 1) % SPEEDS.length;
    anchor = null;
    syncSpeed();
  });
  function applyLang() {
    L = I18N[lang];
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    cv.setAttribute('aria-label', L.map);
    document.querySelector('.hud').setAttribute('aria-label', L.hud);
    document.querySelector('.counts').setAttribute('aria-label', L.counts);
    ['bus', 'lig', 'brt'].forEach(function (g) {
      var c = document.querySelector('.chip[data-g=' + g + ']');
      c.setAttribute('aria-label', L[g + 'Aria']);
      c.querySelector('.lab').textContent = L[g];
    });
    zoomResetBtn.textContent = L.reset;
    el.scrub.setAttribute('aria-label', L.scrub);
    document.getElementById('info').setAttribute('aria-label', L.info);
    document.getElementById('note').innerHTML = L.note;
    syncSnd();
    langBtn.setAttribute('aria-label', L.langAria);
    Array.prototype.forEach.call(langBtn.children, function (s) { s.className = s.getAttribute('data-l') === lang ? 'on' : ''; });
    el.play.setAttribute('aria-label', playing ? L.pause : L.play);
    syncDay(); syncSpeed();
    if (sel !== null) setSel(sel, selName, selMode);
    lastMin = -1; dirty = true;
  }
  langBtn.addEventListener('click', function () {
    lang = lang === 'pt' ? 'en' : 'pt';
    try { localStorage.setItem('cwm-lang', lang); } catch (e) { /* storage unavailable */ }
    applyLang();
    layout();
  });
  // keep iOS from zooming the whole page when pinching near the controls
  try {
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
      document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
    });
  } catch (err) { /* older engines: skip */ }
  var infoBtn = document.getElementById('info'), noteEl = document.getElementById('note');
  infoBtn.addEventListener('click', function () {
    var open = noteEl.hidden;
    noteEl.hidden = !open;
    infoBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    layout();
  });
  el.scrub.addEventListener('input', function () { dragging = true; anchor = null; simT = Math.min(1440, +el.scrub.value) * 60; dirty = true; });
  el.scrub.addEventListener('change', function () { dragging = false; });
  dayBtn.addEventListener('click', function () {
    setDay(DAY_ORDER[(DAY_ORDER.indexOf(day) + 1) % 3]);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.addEventListener('click', function () {
      var g = c.getAttribute('data-g');
      vis[g] = !vis[g];
      c.setAttribute('aria-pressed', vis[g] ? 'true' : 'false');
      dirty = true;
    });
  });

  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 120); });
  setPlay(playing);
  applyLang();
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { buildStatic(); dirty = true; });
  requestAnimationFrame(frame);
})();
</script>
